name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/windows.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kwrt-Studio-Windows-x64
          path: release-assets

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo '::error::Tag must match the application version in CMakeLists.txt.'
            exit 1
          fi
          test -f "release-assets/Kwrt-Studio-$VERSION-Windows-x64.zip"
          (cd release-assets && sha256sum --check --strict SHA256SUMS.txt)
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo '::error::This version tag already points to a different commit.'
              exit 1
            }
          else
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
          fi

      - name: Publish package and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" == false ]]; then
              echo "Release $tag is already published; existing assets are preserved." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            awk -v version="$VERSION" '$0 == "## " version {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
            test -s release-notes.md
            gh release create "$tag" --verify-tag --draft --title "Kwrt Studio $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$tag" "release-assets/Kwrt-Studio-$VERSION-Windows-x64.zip" release-assets/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
